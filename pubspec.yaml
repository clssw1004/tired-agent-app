name: tired_agent_app
description: "tiredAgentMobile — Flutter client for tired-agent"
publish_to: 'none'
version: 0.1.25

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  provider: ^6.1.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.0
  dio: ^5.10.0
  xterm2: ^5.2.0
  uuid: ^4.5.0
  package_info_plus: ^8.0.0
  flutter_local_notifications: ^22.2.0
  path_provider: ^2.1.5
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true

  # JetBrains Mono（OFL 许可）注册为 family 'monospace'，让全部
  # `fontFamily: 'monospace'` 引用（ThemedText.mono/label/code、PTY 面板等）
  # 在 iOS/Android 上一致命中真正的等宽字体，无需改任何代码。
  fonts:
    - family: monospace
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

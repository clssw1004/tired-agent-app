name: tired_agent_app
description: "tiredAgentMobile — Flutter client for tired-agent"
publish_to: 'none'
version: 0.1.25

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  provider: ^6.1.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.0
  dio: ^5.10.0
  xterm2: ^5.2.0
  uuid: ^4.5.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
